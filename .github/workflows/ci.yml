name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Backend (NestJS) ────────────────────────────────────────────────────────
  backend:
    name: backend (lint · tsc · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: be
    env:
      # `prisma generate` читает DATABASE_URL через prisma.config.ts.
      # generate не подключается к БД — фиктивной строки достаточно.
      DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
      # Юнит-тесты гоняют через jest-setup-env.ts с dummy env vars; NODE_ENV=test
      # переводит src/common/config.ts на throw вместо process.exit(1).
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: be/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Lint
        # напрямую eslint, без --fix из npm-скрипта.
        # TODO: убрать continue-on-error после разгребания бэклога:
        #       ~1230 prettier-ошибок (репо не прогнан через prettier) + ~55
        #       реальных (no-unused-vars, no-unnecessary-type-assertion, require-await).
        #       Разово: `cd be && npx eslint "{src,test}/**/*.ts" --fix`, затем чинить остаток.
        run: npx eslint "{src,apps,libs,test}/**/*.ts"
        continue-on-error: true

      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Test
        run: npm test -- --ci --passWithNoTests

  # ─── Frontend (Next.js) ──────────────────────────────────────────────────────
  frontend:
    name: frontend (lint · tsc · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fe/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        # TODO: убрать continue-on-error после разгребания текущих ~46 ошибок eslint
        #       (no-explicit-any, react-hooks/incompatible-library, no-unused-vars)
        run: npm run lint
        continue-on-error: true

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Не отменять идущий деплой при новом пуше — дождаться завершения текущего.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write   # push образа в GitHub Container Registry

jobs:
  # ─── 1. Собрать образ backend и запушить в ghcr.io с тегом по SHA ─────────────
  image:
    name: build · push ghcr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # встроенный, добавлять руками не нужно

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./be
          file: ./be/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── 2. Деплой на Railway: API + BullMQ worker ───────────────────────────────
  # Миграции Prisma гоняются автоматически через deploy.preDeployCommand в
  # be/railway.json — до переключения трафика на новый деплой.
  deploy:
    name: railway up
    needs: image
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.BACKEND_URL }}
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}   # project token, добавить в Secrets руками
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy API service
        run: railway up --service "${{ vars.RAILWAY_API_SERVICE }}" --ci

      - name: Deploy worker service
        run: railway up --service "${{ vars.RAILWAY_WORKER_SERVICE }}" --ci

  # ─── 3. Health-check как гейт ────────────────────────────────────────────────
  # Ждём 200 от GET /health/ready. Railway с healthcheckPath (be/railway.json)
  # сам не переключает трафик на неисправный деплой и оставляет предыдущий —
  # этот job лишь подтверждает снаружи и красит пайплайн при неуспехе.
  healthcheck:
    name: wait for /health/ready
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for health endpoint
        # TODO: после мержа ветки feature/security-hardening выставить
        #       repo variable HEALTHCHECK_PATH = "/health/ready"
        #       (и healthcheckPath в be/railway.json). Сейчас дефолт — "/".
        run: |
          .github/scripts/wait-for-health.sh \
            "${{ vars.BACKEND_URL }}${{ vars.HEALTHCHECK_PATH || '/' }}"

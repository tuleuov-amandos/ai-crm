name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Не отменять идущий деплой при новом пуше — дождаться завершения текущего.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write   # push образа в GitHub Container Registry

jobs:
  # ─── 1. Собрать образ backend и запушить в ghcr.io с тегом по SHA ─────────────
  image:
    name: build · push ghcr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # встроенный, добавлять руками не нужно

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./be
          file: ./be/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── 2. Бэкап прод-БД ПЕРЕД миграциями ───────────────────────────────────────
  # Логический дамп pg_dump через публичный proxy-endpoint Railway — не зависит
  # от тарифа Railway и складывается как artifact ВНЕ Railway. Нативные snapshot'ы
  # Railway (Postgres → Backups) — второй, независимый уровень, включаются руками
  # в дашборде (см. DEPLOYMENT.md).
  backup:
    name: pg_dump · artifact
    needs: image
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}   # публичный proxy-URL Railway, добавить в Environment secrets
    outputs:
      artifact: ${{ steps.dump.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Dump database
        id: dump
        run: |
          name="railway-$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA::12}.dump"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          .github/scripts/backup-db.sh "db-backups/$name"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.sha }}
          path: db-backups/*.dump
          retention-days: 14
          if-no-files-found: error

  # ─── 3. Prisma migrate deploy — отдельный шаг пайплайна ──────────────────────
  # Мигрируем ТОЛЬКО здесь, при реальном деплое новой версии, и только после
  # успешного бэкапа. НЕ в build stage Dockerfile (иначе миграции гонялись бы на
  # каждой сборке образа) и больше НЕ в be/railway.json preDeployCommand.
  migrate:
    name: prisma migrate deploy
    needs: backup
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: be
    environment:
      name: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: be/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      # Drop the 1h role-permission cache so tenants that registered while the
      # Permission catalog was empty pick up the backfilled rules immediately
      # instead of staying 403'd until the cache expires. Non-fatal: the DB is
      # already correct and the cache self-heals via TTL.
      # Needs REDIS_URL as an Environment secret (public proxy URL, same pattern
      # as DATABASE_URL for backup/migrate).
      - name: Invalidate role-permission cache
        continue-on-error: true
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: npm run cache:invalidate-permissions

  # ─── 4. Деплой на Railway: API + BullMQ worker ───────────────────────────────
  # Миграции уже применены job'ом migrate — Railway только катит новый образ.
  deploy:
    name: railway up
    needs: migrate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.BACKEND_URL }}
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}   # project token, добавить в Secrets руками
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy API service
        run: railway up --service "${{ vars.RAILWAY_API_SERVICE }}" --ci

      - name: Deploy worker service
        run: railway up --service "${{ vars.RAILWAY_WORKER_SERVICE }}" --ci

  # ─── 5. Health-check как гейт ────────────────────────────────────────────────
  # Ждём 200 от GET /health/ready. Railway с healthcheckPath (be/railway.json)
  # сам не переключает трафик на неисправный деплой и оставляет предыдущий —
  # этот job лишь подтверждает снаружи и красит пайплайн при неуспехе.
  healthcheck:
    name: wait for /health/ready
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for health endpoint
        # TODO: после мержа ветки feature/security-hardening выставить
        #       repo variable HEALTHCHECK_PATH = "/health/ready"
        #       (и healthcheckPath в be/railway.json). Сейчас дефолт — "/".
        run: |
          .github/scripts/wait-for-health.sh \
            "${{ vars.BACKEND_URL }}${{ vars.HEALTHCHECK_PATH || '/' }}"
